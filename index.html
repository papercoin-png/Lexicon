<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexicon Cards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 8px;
        }
        .game-container { max-width: 500px; width: 100%; }
        
        /* Stats Bar */
        .stats-bar {
            background: #1a1a3a;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border: 1px solid gold;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 12px; color: #aaa; }
        .stat-value { font-size: 20px; font-weight: bold; color: gold; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #1a1a3a;
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .tab.active {
            background: gold;
            color: black;
            border-color: gold;
        }
        
        /* Merge Chamber */
        .merge-chamber {
            background: #1a1a3a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid gold;
        }
        .slots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .slot {
            width: 80px;
            height: 100px;
            background: #2a2a4a;
            border: 2px dashed gold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .slot.filled {
            border: 3px solid gold;
            background: #3a3a5a;
        }
        .remove-slot {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: red;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid white;
        }
        
        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .card {
            aspect-ratio: 3/4;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3);
            font-weight: bold;
            text-align: center;
        }
        .card.common { background: linear-gradient(135deg, #a0a0a0, #707070); }
        .card.uncommon { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        .card.rare { background: linear-gradient(135deg, #2196f3, #0d47a1); }
        .card.epic { background: linear-gradient(135deg, #9c27b0, #4a0072); }
        .card.legendary { background: linear-gradient(135deg, #ff9800, #bf360c); }
        .card.mythic { background: linear-gradient(135deg, #ffd700, #b8860b); animation: pulse 2s infinite; }
        .card.selected { border: 4px solid gold; transform: scale(1.02); }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } }
        
        .merge-button {
            width: 100%;
            padding: 16px;
            background: gold;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        .merge-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid gold;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">CARDS</div>
                <div class="stat-value" id="totalCards">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">DUST</div>
                <div class="stat-value" id="dustAmount">150</div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('realm')">REALM</div>
            <div class="tab" onclick="switchTab('merge')">MERGE</div>
            <div class="tab" onclick="switchTab('packs')">PACKS</div>
        </div>
        
        <!-- Content -->
        <div id="realmTab">
            <div style="background: #1a1a3a; border-radius: 20px; padding: 20px; border: 1px solid gold;">
                <h3 style="color: gold; margin-bottom: 16px;">Welcome to Realm</h3>
                <p>Select MERGE tab to combine cards</p>
            </div>
        </div>
        
        <div id="mergeTab" style="display: none;">
            <!-- Merge Chamber -->
            <div class="merge-chamber">
                <h3 style="color: gold; text-align: center;">Merge Chamber</h3>
                <div class="slots">
                    <div class="slot" id="slot1"></div>
                    <div class="slot" id="slot2"></div>
                    <div class="slot" id="slot3"></div>
                </div>
                
                <!-- Preview -->
                <div id="mergePreview" style="text-align: center; margin: 12px 0; color: gold;">
                    Select 3 cards of the same rarity
                </div>
                
                <!-- Merge Button -->
                <button class="merge-button" id="mergeBtn" onclick="performMerge()" disabled>
                    MERGE (select 3 cards)
                </button>
            </div>
            
            <!-- Card Grid -->
            <div style="background: #1a1a3a; border-radius: 20px; padding: 20px;">
                <h3 style="color: gold; margin-bottom: 16px;">Your Cards</h3>
                <div class="cards-grid" id="mergeGrid"></div>
            </div>
        </div>
        
        <div id="packsTab" style="display: none;">
            <div style="background: #1a1a3a; border-radius: 20px; padding: 20px;">
                <h3 style="color: gold; margin-bottom: 16px;">Packs</h3>
                <button onclick="openPack()" style="width: 100%; padding: 16px; background: gold; border: none; border-radius: 12px; font-weight: bold;">Open Basic Pack (50 dust)</button>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize Telegram
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // Game State
        let collection = [];
        let dust = 150;
        let selectedCards = [];
        
        // Card Pools
        const WORDS = {
            common: ['SUN', 'MOON', 'STAR', 'TREE', 'FIRE', 'WATER'],
            uncommon: ['FLAME', 'OCEAN', 'FOREST', 'THUNDER'],
            rare: ['PHOENIX', 'DRAGON', 'UNICORN'],
            epic: ['ENIGMA', 'ETERNITY', 'COSMOS'],
            legendary: ['SERENDIPITY', 'ETHEREAL'],
            mythic: ['ABRACADABRA']
        };
        
        const RARITY_ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
        
        // Initialize with some cards
        for (let i = 0; i < 5; i++) {
            collection.push({
                id: Date.now() + i,
                word: WORDS.common[Math.floor(Math.random() * WORDS.common.length)],
                rarity: 'common'
            });
        }
        
        // Helper Functions
        function showToast(msg) {
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function updateUI() {
            document.getElementById('totalCards').textContent = collection.length;
            document.getElementById('dustAmount').textContent = dust;
            if (document.getElementById('mergeTab').style.display !== 'none') {
                renderMergeGrid();
            }
        }
        
        // Tab Switching
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('realmTab').style.display = 'none';
            document.getElementById('mergeTab').style.display = 'none';
            document.getElementById('packsTab').style.display = 'none';
            
            document.getElementById(tab + 'Tab').style.display = 'block';
            
            if (tab === 'merge') {
                renderMergeGrid();
            }
        };
        
        // Merge Functions
        window.addToMerge = function(cardId) {
            let card = collection.find(c => c.id === cardId);
            if (!card) return;
            
            // Check if already selected
            if (selectedCards.includes(cardId)) {
                showToast('Card already selected');
                return;
            }
            
            // Check max 3 cards
            if (selectedCards.length >= 3) {
                showToast('Maximum 3 cards');
                return;
            }
            
            // Check same rarity
            if (selectedCards.length > 0) {
                let firstCard = collection.find(c => c.id === selectedCards[0]);
                if (firstCard.rarity !== card.rarity) {
                    showToast('Cards must be same rarity');
                    return;
                }
            }
            
            // Check not mythic
            if (card.rarity === 'mythic') {
                showToast('Mythic cards cannot be merged');
                return;
            }
            
            selectedCards.push(cardId);
            renderMergeGrid();
            updateMergeButton();
        };
        
        window.removeFromMerge = function(index) {
            selectedCards.splice(index, 1);
            renderMergeGrid();
            updateMergeButton();
        };
        
        // THE FIXED MERGE FUNCTION
        window.performMerge = function() {
            console.log('Merge clicked', selectedCards);
            
            if (selectedCards.length !== 3) {
                showToast('Select 3 cards first');
                return;
            }
            
            // Get the cards
            let cards = collection.filter(c => selectedCards.includes(c.id));
            if (cards.length !== 3) {
                showToast('Error finding cards');
                return;
            }
            
            // Verify same rarity
            let rarity = cards[0].rarity;
            if (!cards.every(c => c.rarity === rarity)) {
                showToast('Cards must be same rarity');
                return;
            }
            
            // Get target rarity
            let currentIndex = RARITY_ORDER.indexOf(rarity);
            if (currentIndex === -1 || currentIndex >= RARITY_ORDER.length - 1) {
                showToast('Cannot merge these cards');
                return;
            }
            
            let targetRarity = RARITY_ORDER[currentIndex + 1];
            
            // Success chances
            let chance = 1.0; // Default 100%
            if (rarity === 'uncommon') chance = 0.8;
            if (rarity === 'rare') chance = 0.5;
            if (rarity === 'epic') chance = 0.3;
            if (rarity === 'legendary') chance = 0.1;
            
            // Remove the merged cards
            cards.forEach(c => {
                let index = collection.findIndex(coll => coll.id === c.id);
                if (index !== -1) collection.splice(index, 1);
            });
            
            // Clear selection
            selectedCards = [];
            
            // Attempt merge
            if (Math.random() < chance) {
                // Success
                let newCard = {
                    id: Date.now() + Math.random(),
                    word: WORDS[targetRarity][Math.floor(Math.random() * WORDS[targetRarity].length)],
                    rarity: targetRarity
                };
                collection.push(newCard);
                showToast(`✨ Success! Got ${newCard.word} (${targetRarity})`);
                
                if (targetRarity === 'mythic') {
                    alert('🎉 MYTHIC UNLOCKED!');
                }
            } else {
                // Failure - give dust
                let dustReward = 5;
                if (rarity === 'uncommon') dustReward = 10;
                if (rarity === 'rare') dustReward = 25;
                if (rarity === 'epic') dustReward = 100;
                if (rarity === 'legendary') dustReward = 200;
                
                dust += dustReward;
                showToast(`💔 Failed +${dustReward} dust`);
            }
            
            // Update UI
            updateUI();
            renderMergeGrid();
            updateMergeButton();
        };
        
        function renderMergeGrid() {
            let grid = document.getElementById('mergeGrid');
            if (!grid) return;
            
            grid.innerHTML = '';
            collection.forEach(card => {
                let cardEl = document.createElement('div');
                cardEl.className = `card ${card.rarity}`;
                if (selectedCards.includes(card.id)) {
                    cardEl.classList.add('selected');
                }
                cardEl.onclick = () => addToMerge(card.id);
                cardEl.innerHTML = `<div>${card.word}</div><div style="font-size: 10px;">${card.rarity}</div>`;
                grid.appendChild(cardEl);
            });
            
            // Update slots
            for (let i = 0; i < 3; i++) {
                let slot = document.getElementById(`slot${i+1}`);
                if (!slot) continue;
                
                if (selectedCards[i]) {
                    let card = collection.find(c => c.id === selectedCards[i]);
                    if (card) {
                        slot.className = `slot filled ${card.rarity}`;
                        slot.innerHTML = `
                            <div>${card.word}</div>
                            <div class="remove-slot" onclick="removeFromMerge(${i})">✕</div>
                        `;
                        continue;
                    }
                }
                slot.className = 'slot';
                slot.innerHTML = '';
            }
        }
        
        function updateMergeButton() {
            let btn = document.getElementById('mergeBtn');
            if (!btn) return;
            
            if (selectedCards.length === 3) {
                btn.disabled = false;
                btn.textContent = 'MERGE (ready)';
            } else {
                btn.disabled = true;
                btn.textContent = `MERGE (select ${3 - selectedCards.length} more)`;
            }
        }
        
        window.openPack = function() {
            if (dust < 50) {
                showToast('Not enough dust');
                return;
            }
            
            dust -= 50;
            let cards = [];
            for (let i = 0; i < 3; i++) {
                cards.push({
                    id: Date.now() + i + Math.random(),
                    word: WORDS.common[Math.floor(Math.random() * WORDS.common.length)],
                    rarity: 'common'
                });
            }
            collection.push(...cards);
            showToast('Opened pack!');
            updateUI();
        };
        
        // Initialize
        updateUI();
    </script>
</body>
</html>
