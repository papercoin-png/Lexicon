<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ages of Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 8px;
        }

        #game-container {
            max-width: 400px;
            width: 100%;
            background: #0f1424;
            border-radius: 24px;
            padding: 12px;
            border: 1px solid #ffd70030;
            height: fit-content;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .crystals {
            background: #00000040;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #ffd700;
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Age Card */
        .age-card {
            background: linear-gradient(145deg, #1a1f2e, #0f1424);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #8B7355;
        }

        .age-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .age-name {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
        }

        .age-theme {
            color: #a0a0a0;
            font-size: 10px;
        }

        .age-progress {
            height: 4px;
            background: #ffffff10;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .age-progress-fill {
            height: 100%;
            background: #ffd700;
            width: 0%;
        }

        /* Timeline */
        .timeline {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }

        .timeline::-webkit-scrollbar {
            display: none;
        }

        .timeline-dot {
            min-width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #1a1f2e;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            padding: 0 4px;
        }

        /* Letters Grid */
        .letters-section {
            background: #0a0f1a;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .letter-tile {
            aspect-ratio: 1;
            background: #1a1f2e;
            border: 1px solid #ffd70040;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            position: relative;
        }

        .letter-tile.selected {
            background: #ffd70020;
            border-color: #ffd700;
        }

        .letter-tile.empty {
            opacity: 0.3;
            border-color: #404040;
        }

        .letter-count {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #ffd700;
            color: #000;
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 6px;
        }

        /* Word Display */
        .word-display {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            border: 1px dashed #ffd700;
        }

        .word-letters {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 4px;
            min-height: 36px;
        }

        .word-hint {
            font-size: 10px;
            color: #a0a0a0;
        }

        /* Buttons */
        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #ffd700;
            color: #000;
        }

        .btn-primary:disabled {
            opacity: 0.3;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
        }

        /* Words Grid */
        .words-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .word-card {
            background: #1a1f2e;
            border: 1px solid #ffd70020;
            border-radius: 8px;
            padding: 6px;
            font-size: 11px;
        }

        .word-name {
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }

        .word-letters-req {
            color: #a0a0a0;
            font-size: 9px;
        }

        .word-desc {
            color: #fff;
            font-size: 9px;
            opacity: 0.8;
        }

        .word-card.craftable {
            border-color: #ffd700;
            background: #ffd70010;
        }

        /* Age Gate */
        .age-gate {
            background: #1a1f2e;
            border: 1px dashed #ffd700;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }

        .gate-name {
            color: #ffd700;
            font-weight: bold;
        }

        .gate-req {
            color: #a0a0a0;
            font-size: 10px;
        }

        /* Expedition */
        .expedition-btn {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            background: #2a1f0a;
            border: 1px solid #ffd700;
            border-radius: 30px;
            color: #ffd700;
            font-size: 12px;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000cc;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f1424;
            border-radius: 24px;
            padding: 20px;
            border: 2px solid #ffd700;
            max-width: 300px;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: #000;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <div class="header">
            <div class="title">📖 AGES OF DISCOVERY</div>
            <div class="crystals">
                <span>⏳</span>
                <span id="crystal-display">100</span>
            </div>
        </div>

        <!-- Current Age -->
        <div class="age-card" id="age-card">
            <div class="age-row">
                <span class="age-name" id="current-age-name">Age of Stone</span>
                <span class="age-theme" id="current-age-theme">Survival</span>
            </div>
            <div class="age-progress">
                <div class="age-progress-fill" id="age-progress"></div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline" id="timeline"></div>

        <!-- Letters -->
        <div class="letters-section">
            <div class="section-header">
                <span>🔤 Runes</span>
                <span id="letter-count">0</span>
            </div>
            <div class="letters-grid" id="letters-grid"></div>
        </div>

        <!-- Word Display -->
        <div class="word-display">
            <div class="word-letters" id="current-word-display">⚡</div>
            <div class="word-hint" id="word-hint">Select runes</div>
        </div>

        <!-- Buttons -->
        <div class="button-row">
            <button class="btn btn-primary" id="craft-btn" disabled>✨ Speak Word</button>
            <button class="btn btn-secondary" id="clear-btn">Clear</button>
        </div>

        <!-- Words -->
        <div class="words-grid" id="words-grid"></div>

        <!-- Age Gate -->
        <div class="age-gate" id="age-gate">
            <div class="gate-name" id="next-age-name">Age of Bronze</div>
            <div class="gate-req" id="gate-requirement">Craft all words to unlock</div>
        </div>

        <!-- Expedition -->
        <button class="expedition-btn" onclick="startExpedition()">
            🗺️ Expedition (15 Crystals)
        </button>
    </div>

    <!-- Modal -->
    <div class="modal" id="lore-modal">
        <div class="modal-content">
            <h3 style="color: #ffd700; margin-bottom: 10px;">📖 The Lexicon's Lament</h3>
            <p style="color: white; font-size: 12px; margin-bottom: 15px;">
                Words have faded from the world. Journey through the ages and rediscover them.
            </p>
            <button class="btn btn-primary" style="width: 100%;" onclick="closeLoreModal()">Begin</button>
        </div>
    </div>

    <script>
        // ==================== GAME DATA ====================
        const AGES = {
            STONE: {
                name: 'Stone',
                theme: 'Survival',
                color: '#8B7355',
                next: 'BRONZE',
                words: ['FIRE', 'STONE', 'HUT', 'AXE', 'WELL']
            },
            BRONZE: {
                name: 'Bronze',
                theme: 'Tools',
                color: '#CD7F32',
                next: 'IRON',
                words: ['FORGE', 'FIELD', 'OVEN', 'SWORD', 'SHIELD']
            },
            IRON: {
                name: 'Iron',
                theme: 'War',
                color: '#707070',
                next: 'GOLDEN',
                words: ['CASTLE', 'KNIGHT', 'ARMOR', 'BANNER', 'THRONE']
            },
            GOLDEN: {
                name: 'Golden',
                theme: 'Culture',
                color: '#FFD700',
                next: 'MYSTICAL',
                words: ['LIBRARY', 'GARDEN', 'FEAST', 'MUSIC', 'POETRY']
            },
            MYSTICAL: {
                name: 'Mystical',
                theme: 'Magic',
                color: '#9B30FF',
                next: 'COSMIC',
                words: ['PHOENIX', 'DRAGON', 'WIZARD', 'POTION', 'RUNE']
            },
            COSMIC: {
                name: 'Cosmic',
                theme: 'Infinity',
                color: '#00FFFF',
                next: null,
                words: ['GALAXY', 'INFINITY', 'DREAM', 'COSMOS', 'ETERNITY']
            }
        };

        const WORD_DB = {
            // Stone Age
            'FIRE': { age: 'STONE', letters: ['F','I','R','E'], points: 10 },
            'STONE': { age: 'STONE', letters: ['S','T','O','N','E'], points: 15 },
            'HUT': { age: 'STONE', letters: ['H','U','T'], points: 12 },
            'AXE': { age: 'STONE', letters: ['A','X','E'], points: 15 },
            'WELL': { age: 'STONE', letters: ['W','E','L','L'], points: 18 },
            
            // Bronze Age
            'FORGE': { age: 'BRONZE', letters: ['F','O','R','G','E'], points: 25 },
            'FIELD': { age: 'BRONZE', letters: ['F','I','E','L','D'], points: 22 },
            'OVEN': { age: 'BRONZE', letters: ['O','V','E','N'], points: 20 },
            'SWORD': { age: 'BRONZE', letters: ['S','W','O','R','D'], points: 30 },
            'SHIELD': { age: 'BRONZE', letters: ['S','H','I','E','L','D'], points: 28 },
            
            // Iron Age
            'CASTLE': { age: 'IRON', letters: ['C','A','S','T','L','E'], points: 50 },
            'KNIGHT': { age: 'IRON', letters: ['K','N','I','G','H','T'], points: 45 },
            'ARMOR': { age: 'IRON', letters: ['A','R','M','O','R'], points: 40 },
            'BANNER': { age: 'IRON', letters: ['B','A','N','N','E','R'], points: 35 },
            'THRONE': { age: 'IRON', letters: ['T','H','R','O','N','E'], points: 55 },
            
            // Golden Age
            'LIBRARY': { age: 'GOLDEN', letters: ['L','I','B','R','A','R','Y'], points: 60 },
            'GARDEN': { age: 'GOLDEN', letters: ['G','A','R','D','E','N'], points: 45 },
            'FEAST': { age: 'GOLDEN', letters: ['F','E','A','S','T'], points: 50 },
            'MUSIC': { age: 'GOLDEN', letters: ['M','U','S','I','C'], points: 48 },
            'POETRY': { age: 'GOLDEN', letters: ['P','O','E','T','R','Y'], points: 52 },
            
            // Mystical Age
            'PHOENIX': { age: 'MYSTICAL', letters: ['P','H','O','E','N','I','X'], points: 80 },
            'DRAGON': { age: 'MYSTICAL', letters: ['D','R','A','G','O','N'], points: 85 },
            'WIZARD': { age: 'MYSTICAL', letters: ['W','I','Z','A','R','D'], points: 75 },
            'POTION': { age: 'MYSTICAL', letters: ['P','O','T','I','O','N'], points: 70 },
            'RUNE': { age: 'MYSTICAL', letters: ['R','U','N','E'], points: 65 },
            
            // Cosmic Age
            'GALAXY': { age: 'COSMIC', letters: ['G','A','L','A','X','Y'], points: 100 },
            'INFINITY': { age: 'COSMIC', letters: ['I','N','F','I','N','I','T','Y'], points: 120 },
            'DREAM': { age: 'COSMIC', letters: ['D','R','E','A','M'], points: 90 },
            'COSMOS': { age: 'COSMIC', letters: ['C','O','S','M','O','S'], points: 140 },
            'ETERNITY': { age: 'COSMIC', letters: ['E','T','E','R','N','I','T','Y'], points: 130 }
        };

        // ==================== GAME STATE ====================
        let gameState = {
            currentAge: 'STONE',
            discoveredWords: [],
            letters: {},
            timeCrystals: 100,
            selectedLetters: [],
            completedAges: []
        };

        // ==================== INITIALIZATION ====================
        function initGame() {
            const saved = localStorage.getItem('agesOfDiscovery');
            if (saved) {
                gameState = JSON.parse(saved);
            } else {
                // Start with basic letters
                const starters = ['A','A','E','E','I','O','U','R','S','T','N','F','H','L','C','M','P','X'];
                starters.forEach(letter => {
                    gameState.letters[letter] = (gameState.letters[letter] || 0) + 1;
                });
            }
            updateUI();
            
            // Show modal for new players
            if (!localStorage.getItem('loreSeen')) {
                document.getElementById('lore-modal').classList.add('active');
                localStorage.setItem('loreSeen', 'true');
            }
        }

        // ==================== UI UPDATE ====================
        function updateUI() {
            const age = AGES[gameState.currentAge];
            
            // Age card
            document.getElementById('current-age-name').textContent = `Age of ${age.name}`;
            document.getElementById('current-age-theme').textContent = age.theme;
            document.getElementById('age-card').style.borderLeftColor = age.color;
            
            // Progress
            const ageWords = age.words.filter(w => gameState.discoveredWords.includes(w)).length;
            const progress = (ageWords / age.words.length) * 100;
            document.getElementById('age-progress').style.width = `${progress}%`;
            
            // Timeline
            updateTimeline();
            
            // Letters
            updateLetters();
            
            // Words
            updateWords();
            
            // Age gate
            updateAgeGate();
            
            // Crystal count
            document.getElementById('crystal-display').textContent = gameState.timeCrystals;
            
            // Letter count
            const totalLetters = Object.values(gameState.letters).reduce((a,b) => a+b, 0);
            document.getElementById('letter-count').textContent = totalLetters;
            
            // Craft button
            updateCraftButton();
            
            // Word display
            updateWordDisplay();
        }

        function updateTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            
            Object.entries(AGES).forEach(([id, age]) => {
                const dot = document.createElement('div');
                dot.className = 'timeline-dot';
                dot.style.borderColor = age.color;
                
                if (gameState.completedAges.includes(id)) {
                    dot.innerHTML = '✓';
                    dot.style.background = `${age.color}30`;
                } else if (id === gameState.currentAge) {
                    dot.innerHTML = age.name;
                    dot.style.background = `${age.color}20`;
                } else {
                    dot.innerHTML = '○';
                }
                
                timeline.appendChild(dot);
            });
        }

        function updateLetters() {
            const grid = document.getElementById('letters-grid');
            grid.innerHTML = '';
            
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
                const count = gameState.letters[letter] || 0;
                const tile = document.createElement('div');
                tile.className = `letter-tile ${count === 0 ? 'empty' : ''} ${gameState.selectedLetters.includes(letter) ? 'selected' : ''}`;
                tile.textContent = letter;
                
                if (count > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'letter-count';
                    badge.textContent = count;
                    tile.appendChild(badge);
                    tile.onclick = () => toggleLetter(letter);
                }
                
                grid.appendChild(tile);
            });
        }

        function updateWords() {
            const grid = document.getElementById('words-grid');
            grid.innerHTML = '';
            
            const currentWords = AGES[gameState.currentAge].words;
            
            currentWords.forEach(word => {
                if (gameState.discoveredWords.includes(word)) {
                    // Discovered word
                    const card = document.createElement('div');
                    card.className = 'word-card';
                    card.style.background = '#ffd70010';
                    card.innerHTML = `
                        <div class="word-name">✨ ${word}</div>
                        <div class="word-desc">${WORD_DB[word].points} pts</div>
                    `;
                    grid.appendChild(card);
                } else {
                    // Undiscovered word
                    const card = document.createElement('div');
                    const craftable = canCraftWord(word);
                    card.className = `word-card ${craftable ? 'craftable' : ''}`;
                    card.innerHTML = `
                        <div class="word-name">${word}</div>
                        <div class="word-letters-req">${WORD_DB[word].letters.join('')}</div>
                        <div class="word-desc">${WORD_DB[word].points} pts</div>
                    `;
                    if (craftable) {
                        card.onclick = () => autofillWord(word);
                    }
                    grid.appendChild(card);
                }
            });
        }

        function updateAgeGate() {
            const age = AGES[gameState.currentAge];
            const gate = document.getElementById('age-gate');
            const nextName = document.getElementById('next-age-name');
            const req = document.getElementById('gate-requirement');
            
            if (!age.next) {
                gate.style.display = 'none';
                return;
            }
            
            const next = AGES[age.next];
            nextName.textContent = `Age of ${next.name}`;
            
            const wordsFound = age.words.filter(w => gameState.discoveredWords.includes(w)).length;
            const needed = age.words.length;
            
            if (wordsFound >= needed) {
                gate.style.background = '#ffd70020';
                req.textContent = '✨ Ready to advance (50 crystals)';
                gate.onclick = advanceAge;
            } else {
                gate.style.background = '#1a1f2e';
                req.textContent = `Need ${needed - wordsFound} more words`;
                gate.onclick = null;
            }
        }

        function updateCraftButton() {
            const word = gameState.selectedLetters.join('');
            const btn = document.getElementById('craft-btn');
            btn.disabled = !WORD_DB[word] || !canCraftWord(word);
        }

        function updateWordDisplay() {
            const display = document.getElementById('current-word-display');
            const hint = document.getElementById('word-hint');
            
            if (gameState.selectedLetters.length === 0) {
                display.textContent = '⚡';
                hint.textContent = 'Select runes';
            } else {
                display.textContent = gameState.selectedLetters.join('');
                const word = gameState.selectedLetters.join('');
                if (WORD_DB[word]) {
                    hint.textContent = `✨ ${WORD_DB[word].points} points`;
                } else {
                    hint.textContent = '❌ No power';
                }
            }
        }

        // ==================== GAME ACTIONS ====================
        function toggleLetter(letter) {
            const index = gameState.selectedLetters.indexOf(letter);
            const count = gameState.selectedLetters.filter(l => l === letter).length;
            
            if (index === -1) {
                if (count < (gameState.letters[letter] || 0)) {
                    gameState.selectedLetters.push(letter);
                }
            } else {
                gameState.selectedLetters.splice(index, 1);
            }
            
            updateUI();
        }

        function canCraftWord(word) {
            const data = WORD_DB[word];
            if (!data) return false;
            if (gameState.discoveredWords.includes(word)) return false;
            
            // Check age
            const ageIndex = Object.keys(AGES).indexOf(gameState.currentAge);
            const wordAgeIndex = Object.keys(AGES).indexOf(data.age);
            if (wordAgeIndex > ageIndex) return false;
            
            // Check letters
            const letters = {...gameState.letters};
            for (const letter of data.letters) {
                if (!letters[letter] || letters[letter] === 0) return false;
                letters[letter]--;
            }
            
            return true;
        }

        function craftWord() {
            const word = gameState.selectedLetters.join('');
            
            if (WORD_DB[word] && canCraftWord(word)) {
                // Use letters
                for (const letter of gameState.selectedLetters) {
                    gameState.letters[letter]--;
                }
                
                // Add word
                gameState.discoveredWords.push(word);
                
                // Add crystals
                gameState.timeCrystals += WORD_DB[word].points;
                
                // Clear selection
                gameState.selectedLetters = [];
                
                // Save
                saveGame();
                showNotification(`✨ ${word} +${WORD_DB[word].points}`);
                updateUI();
            }
        }

        function autofillWord(word) {
            if (canCraftWord(word)) {
                gameState.selectedLetters = [...WORD_DB[word].letters];
                updateUI();
            }
        }

        function clearSelection() {
            gameState.selectedLetters = [];
            updateUI();
        }

        function advanceAge() {
            if (gameState.timeCrystals >= 50) {
                gameState.timeCrystals -= 50;
                gameState.completedAges.push(gameState.currentAge);
                gameState.currentAge = AGES[gameState.currentAge].next;
                
                // Bonus letters
                const bonus = ['A','E','I','O','U'];
                bonus.forEach(l => gameState.letters[l] = (gameState.letters[l] || 0) + 2);
                
                showNotification(`🌟 Entered Age of ${AGES[gameState.currentAge].name}`);
                saveGame();
                updateUI();
            } else {
                showNotification('❌ Need 50 crystals');
            }
        }

        function startExpedition() {
            if (gameState.timeCrystals >= 15) {
                gameState.timeCrystals -= 15;
                
                const found = [];
                for (let i = 0; i < 3; i++) {
                    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    const letter = letters[Math.floor(Math.random() * letters.length)];
                    gameState.letters[letter] = (gameState.letters[letter] || 0) + 1;
                    found.push(letter);
                }
                
                showNotification(`🗺️ Found: ${found.join('')}`);
                saveGame();
                updateUI();
            } else {
                showNotification('❌ Need 15 crystals');
            }
        }

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        function closeLoreModal() {
            document.getElementById('lore-modal').classList.remove('active');
        }

        function saveGame() {
            localStorage.setItem('agesOfDiscovery', JSON.stringify(gameState));
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('craft-btn').addEventListener('click', craftWord);
        document.getElementById('clear-btn').addEventListener('click', clearSelection);

        // Daily bonus
        function checkDaily() {
            const last = localStorage.getItem('lastDaily');
            const today = new Date().toDateString();
            
            if (last !== today) {
                gameState.timeCrystals += 20;
                ['A','E','I','O','U','R','S','T'].forEach(l => {
                    gameState.letters[l] = (gameState.letters[l] || 0) + 1;
                });
                showNotification('📅 Daily bonus +20');
                localStorage.setItem('lastDaily', today);
                saveGame();
                updateUI();
            }
        }

        // Start
        initGame();
        checkDaily();

        // Telegram
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
